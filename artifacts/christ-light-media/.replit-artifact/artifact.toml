kind = "web"
previewPath = "/"
title = "Christ Light Media"
version = "1.0.0"
id = "artifacts/christ-light-media"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25680

[services.development]
run = "pnpm --filter @workspace/christ-light-media run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/christ-light-media", "run", "build" ]
publicDir = "artifacts/christ-light-media/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25680"
BASE_PATH = "/"
